[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchored-world-model"
version = "0.0.1"
description = "Research instrument for separating generative world belief from external evidential support."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["worldmodel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
